name: PR04 - ROS Jazzy and evidence
on:
  push:
    branches: [pr04]
  pull_request:
    paths:
      - 'PR04/**'
      - '.github/workflows/pr04.yml'
  workflow_dispatch:

jobs:
  practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: osrf/ros:jazzy-desktop
    defaults:
      run:
        shell: bash
        working-directory: PR04
    env:
      ROS_DOMAIN_ID: '47'
      QT_QPA_PLATFORM: offscreen
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
      COURSE_KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-pytest ros-jazzy-ament-flake8 ros-jazzy-ament-pep257 ros-jazzy-ament-copyright curl
      - name: Build and test ROS packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol
          source install/setup.bash
          python3 -m pytest src/patrol/test
          python3 -m pytest -q scripts/test_ros_support.py
          (cd src/turtle_bringup && python3 -m pytest -q test)
          colcon test --packages-select turtle_bringup patrol --event-handlers console_direct+
          colcon test-result --verbose
          python3 scripts/check_pr04.py
      - name: Verify course kit and evidence
        run: |
          mkdir -p .course-kit
          curl -fsSLo .course-kit/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" .course-kit/course-kit.tar.gz | sha256sum -c -
          tar -xzf .course-kit/course-kit.tar.gz -C .course-kit
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('evidence/pr04/report.json').read_text())
          assert report['course_kit']['version'] == 'v1-w07'
          assert report['course_kit']['archive_sha256'] == os.environ['COURSE_KIT_SHA256']
          PYTHON
          python3 .course-kit/v1/tools/check_practice.py PR04 --submission .
